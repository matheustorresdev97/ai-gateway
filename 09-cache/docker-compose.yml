# Banco vetorial do cache semântico (exemplos 3 e 4): PostgreSQL + pgvector.
# Suba com:  docker compose up -d     (pare com: docker compose down)
# Porta 5433 para não brigar com um Postgres que já rode na 5432.

services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache"]
      interval: 3s
      retries: 20
